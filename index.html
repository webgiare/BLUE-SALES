
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLUE SALES</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="app">
    <section id="login-screen" class="login-screen">
      <div class="login-card">
        <h1>BLUE SALES</h1>
        <p>Hệ thống quản lý bán hàng</p>
        <input id="password" type="password"
          placeholder="Nhập mật khẩu">
        <button onclick="login()">ĐĂNG NHẬP</button>
        <p id="login-error"></p>
      </div>
    </section>

    <section id="main-screen" hidden>
      <header>
        <h1>BLUE SALES</h1>
        <button onclick="logout()">Đăng xuất</button>
      </header>

      <main>
        <h2>Chọn loại hình kinh doanh</h2>
        <div class="business-list">
          <button onclick="selectBusiness('trasua')">
            🧋 TRÀ SỮA
          </button>
          <button onclick="selectBusiness('caphe')">
            ☕ CÀ PHÊ
          </button>
        </div>

        <div id="store-screen" hidden>
          <button onclick="backHome()">← Quay lại</button>
          <h2 id="business-title"></h2>
          <div id="store-list"></div>
          <button onclick="createStore()">+ Tạo cửa hàng</button>
        </div>

        <div id="sales-screen" hidden>
          <button onclick="backStores()">← Danh sách cửa hàng</button>
          <h2 id="store-title"></h2>

          <div class="menu-actions">
            <button onclick="openMenu()">Quản lý menu</button>
            <button onclick="openSales()">Bán hàng</button>
            <button onclick="openReports()">Báo cáo</button>
          </div>

          <div id="content"></div>
        </div>
      </main>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
